name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  validate:
    name: Verify exact signed tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
      tag_object: ${{ steps.identity.outputs.tag_object }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned verification helper
        run: bash scripts/release-install-decernor.sh
      - name: Verify annotated object, version, pin and GitHub status
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          CHANVOY_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          bash scripts/release-restore-tag-ref.sh
          bash scripts/release-guard-tag-version.sh
          bash scripts/verify-pinned-tag.sh
          object="$(git rev-parse "refs/tags/$CHANVOY_RELEASE_TAG")"
          commit="$(git rev-parse HEAD)"
          tag_json="$(gh api "repos/lanytehq/chanvoy/git/tags/$object")"
          jq -e --arg tag "$CHANVOY_RELEASE_TAG" --arg commit "$commit" \
            '.tag == $tag and .object.type == "commit" and .object.sha == $commit and
            .verification.verified == true and .verification.reason == "valid"' \
            <<<"$tag_json" >/dev/null
          printf 'tag_object=%s\ncommit=%s\nversion=%s\n' "$object" "$commit" "$(cat VERSION)" >>"$GITHUB_OUTPUT"
  build:
    name: Binary (${{ matrix.platform }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - runner: ubuntu-latest-arm64-s
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: macos-aarch64
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # master (pinned commit)
        with:
          toolchain: 1.89.0
      - name: Verify native host
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: test "$(rustc -vV | awk '/^host:/{print $2}')" = "$EXPECTED_TARGET"
      - name: Build standalone binary
        run: make build-release
      - name: Stage exact binary
        id: binary
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          asset="chanvoy-v${RELEASE_VERSION}-${RELEASE_PLATFORM}"
          cp target/release/chanvoy "$asset"
          printf 'asset=%s\n' "$asset" >>"$GITHUB_OUTPUT"
      - name: Upload exact binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: binary-${{ matrix.platform }}
          path: ${{ steps.binary.outputs.asset }}
          if-no-files-found: error
          retention-days: 7
  sbom:
    name: Versioned CycloneDX SBOM
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: Generate SBOM with pinned Syft
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          docker run --rm --volume "$PWD:/src:ro" --workdir /src \
            anchore/syft@sha256:f94e5d9fce1f2278491a8e3a63bd5f6ddb81fdfdbb8bf7a1637565c1d5344357 \
            dir:. --output cyclonedx-json >"sbom-${RELEASE_VERSION}.cdx.json"
          test -s "sbom-${RELEASE_VERSION}.cdx.json"
      - name: Upload exact SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom
          path: sbom-${{ needs.validate.outputs.version }}.cdx.json
          if-no-files-found: error
          retention-days: 7
  packages:
    name: Exact base inventory
    needs: [validate, build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: Download all three native artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: binary-*
          path: dist/release
          merge-multiple: true
      - name: Download SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: sbom
          path: dist/release
      - name: Assert canonical complete base inventory
        env:
          CHANVOY_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp LICENSE-MIT LICENSE-APACHE dist/release/
          bash scripts/validate-release-assets.sh dist/release base
      - name: Upload exact workflow packages only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-packages-${{ github.ref_name }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 7
