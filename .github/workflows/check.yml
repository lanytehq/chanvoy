---
name: check

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MSRV: "1.89.0"
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  release_tooling:
    name: Synthetic release provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install synthetic ceremony tools
        run: sudo apt-get update && sudo apt-get install -y minisign gnupg jq
      - name: Install checksum-pinned verification helper
        run: bash scripts/release-install-decernor.sh
      - run: make release-tooling-test

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
          components: rustfmt, clippy
      - run: make check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
      - run: make msrv

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
      - run: make test-integration

  shipping_x86_qualification:
    name: Optimized native x86 qualification
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: 1.89.0
      QUALIFICATION_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
      - name: Build normal standalone binary with compiler receipts
        timeout-minutes: 12
        run: |
          set -euo pipefail
          qual_dir="$RUNNER_TEMP/qualification-linux-x86_64"
          mkdir -m700 "$qual_dir"
          cargo fetch --locked >"$qual_dir/fetch.log" 2>&1
          # Same compilation flags as make build-release; JSON is output formatting only.
          cargo build --release --locked --package chanvoy --message-format=json-render-diagnostics \
            >"$qual_dir/normal-build.jsonl" 2>"$qual_dir/normal-build.stderr.log"
      - name: Qualify preserved candidate bytes
        timeout-minutes: 15
        run: |
          set -euo pipefail
          qual_dir="$RUNNER_TEMP/qualification-linux-x86_64"
          payload_hash="$(python3 -c 'import hashlib,pathlib; print(hashlib.sha256(pathlib.Path("target/release/chanvoy").read_bytes()).hexdigest())')"
          python3 scripts/qualify-production-binary.py --root "$PWD" \
            --binary "$PWD/target/release/chanvoy" --normal-build "$qual_dir/normal-build.jsonl" \
            --expected-commit "$QUALIFICATION_COMMIT" --expected-sha256 "$payload_hash" \
            --platform linux-x86_64 --mode candidate --output "$qual_dir" \
            >"$qual_dir/driver.log" 2>&1
      - name: Preserve candidate qualification and first-failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualification-candidate-linux-x86_64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification-linux-x86_64/
          if-no-files-found: warn
          retention-days: 7
