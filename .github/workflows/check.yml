---
name: check

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MSRV: "1.89.0"
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  release_tooling:
    name: Synthetic release provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install synthetic ceremony tools
        run: sudo apt-get update && sudo apt-get install -y minisign gnupg jq
      - name: Install checksum-pinned verification helper
        run: bash scripts/release-install-decernor.sh
      - run: make release-tooling-test

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
          components: rustfmt, clippy
      - run: make check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
      - run: make msrv

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
      - run: make test-integration
