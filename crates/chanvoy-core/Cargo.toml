[package]
name = "chanvoy-core"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared domain types, profile model, JSON-RPC envelopes, and Mattermost client for chanvoy"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
chrono = { workspace = true }
dirs = { workspace = true }
futures-util = { version = "0.3.31", default-features = false, features = ["sink"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { version = "0.26.2", features = ["rustls-tls-webpki-roots"] }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# libc (Unix only): PER-036A / ADR-0016 tool-owned reads verify the containing
# directory is operator-owned (euid via libc::geteuid) + not group/world-writable
# before trusting a followed symlink. Conformance fixtures also use libc::mkfifo.
# Already a transitive dep (reqwest etc.) and declared directly elsewhere in the
# workspace; Unix-gated since the checks are Unix-only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
wiremock = "0.6"
