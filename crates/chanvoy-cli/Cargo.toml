[package]
name = "chanvoy-cli"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
chanvoy-core = { path = "../chanvoy-core" }
chanvoy-daemon = { path = "../chanvoy-daemon" }
chrono = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
# libc: PER-008D detachment uses libc::setsid in pre_exec on the
# auto-setup spawn path (see ensure_daemon_running). Already present in
# the workspace dep tree via sysprims and reqwest; declared explicitly
# here for the direct dependency.
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
