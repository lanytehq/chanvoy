[package]
name = "chanvoy-ipc"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JSON-RPC envelope types and IPC primitives for chanvoy"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
chanvoy-core = { path = "../chanvoy-core" }
chrono = { workspace = true }
ipcprims = { git = "https://github.com/3leaps/ipcprims.git", tag = "v0.2.0", features = ["peer", "async"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Already in the workspace lock (root dev-dependency); declared here so
# the peer's read handlers can be driven against a mocked provider.
wiremock = "0.6"
