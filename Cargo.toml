[package]
name = "chanvoy"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
publish = false

[workspace]
members = [
  ".",
  "crates/chanvoy-core",
  "crates/chanvoy-daemon",
  "crates/chanvoy-cli",
  "crates/chanvoy-mcp",
  "crates/chanvoy-ipc",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"
description = "Mattermost (and eventually Slack) bridge for AI agents and the operators who run them"
repository = "https://github.com/lanytehq/chanvoy"
homepage = "https://github.com/lanytehq/chanvoy"
authors = ["lanytehq Contributors"]
keywords = ["mattermost", "agent", "chat", "bridge", "lanyte"]
categories = ["command-line-utilities", "network-programming"]
readme = "README.md"

[workspace.dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
clap = { version = "4.5.38", features = ["derive"] }
dirs = "6.0.0"
reqwest = { version = "=0.12.15", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.8"
tempfile = "3.20.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1.17"
tokio-util = { version = "0.7.16", features = ["codec"] }
toml = "0.9.5"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[dependencies]
chanvoy-cli = { path = "crates/chanvoy-cli" }
tokio = { workspace = true }

[dev-dependencies]
chanvoy-core = { path = "crates/chanvoy-core" }
# libc: PER-008D test harness uses `libc::getsid` to assert the daemon
# is its own session leader (proof that setsid took effect). Also used
# by `AutoSetupDaemonGuard`'s sync-Drop force-kill path.
libc = "0.2"
serde_json = { workspace = true }
# sysprims is the 3leaps-org primitive for process management. Used in the
# restart harness for reliable SIGKILL delivery (tokio::process::Child::start_kill
# has observed delivery gaps on macOS in a test context). Same git-pin pattern
# chanvoy-ipc uses for ipcprims.
sysprims-proc = { git = "https://github.com/3leaps/sysprims.git", tag = "v0.1.16" }
sysprims-signal = { git = "https://github.com/3leaps/sysprims.git", tag = "v0.1.16" }
tempfile = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
wiremock = "0.6"
