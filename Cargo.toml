[package]
name = "chanvoy"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
members = [
  ".",
  "crates/chanvoy-core",
  "crates/chanvoy-daemon",
  "crates/chanvoy-cli",
  "crates/chanvoy-mcp",
  "crates/chanvoy-ipc",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
clap = { version = "4.5.38", features = ["derive"] }
dirs = "6.0.0"
reqwest = { version = "0.12.15", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.20.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1.17"
tokio-util = { version = "0.7.16", features = ["codec"] }
toml = "0.9.5"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[dependencies]
chanvoy-cli = { path = "crates/chanvoy-cli" }
tokio = { workspace = true }
